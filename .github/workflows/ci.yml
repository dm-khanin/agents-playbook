name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  leak-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Leak scan, tracked files
        env:
          LEAKGUARD_PATTERNS: ${{ secrets.LEAKGUARD_PATTERNS }}
        run: python3 tools/leak-guard/leak_scan.py --tree --require-private
      - name: Leak scan, full history
        env:
          LEAKGUARD_PATTERNS: ${{ secrets.LEAKGUARD_PATTERNS }}
        run: python3 tools/leak-guard/leak_scan.py --history --require-private
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Skill lint
        run: python3 scripts/skill_lint.py
      - name: Test dependencies
        # bats for shell suites, the preinstalled PostgreSQL's initdb for db-tools' server tests, and the Node
        # dependencies db-tools declares.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats
          ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1 >> "$GITHUB_PATH"
          npm ci --prefix tools/db-tools --omit=dev --ignore-scripts
      - name: Tests
        env:
          DBTOOLS_REQUIRE_INTEGRATION: "1"
        run: sh scripts/run-tests.sh
      - name: Install shellcheck
        # The version scripts/shellcheck.sh requires, not the runner's preinstalled one.
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/$archive"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v$SHELLCHECK_VERSION" >> "$GITHUB_PATH"
      - name: shellcheck
        run: sh scripts/shellcheck.sh

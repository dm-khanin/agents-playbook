name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  leak-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Leak scan, tracked files
        env:
          LEAKGUARD_PATTERNS: ${{ secrets.LEAKGUARD_PATTERNS }}
        run: python3 tools/leak-guard/leak_scan.py --tree --require-private
      - name: Leak scan, full history
        env:
          LEAKGUARD_PATTERNS: ${{ secrets.LEAKGUARD_PATTERNS }}
        run: python3 tools/leak-guard/leak_scan.py --history --require-private
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Skill lint
        run: python3 scripts/skill_lint.py
      - name: Tests
        run: sh scripts/run-tests.sh
      - name: shellcheck
        run: git ls-files -z '*.sh' '.githooks/*' 'tools/leak-guard/githooks/*' | xargs -0 shellcheck
